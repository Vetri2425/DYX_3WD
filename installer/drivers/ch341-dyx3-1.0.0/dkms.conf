PACKAGE_NAME="ch341-dyx3"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="ch341"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/serial"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make KVER=${kernelver} clean"
AUTOINSTALL="yes"
