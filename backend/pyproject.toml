[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dyx3-backend"
version = "0.1.0"
description = "DYX 3WD production backend: REST + Socket.IO, auth, tablet-planned mission admission, telemetry, RTK profiles, storage. Never imports rclpy — reaches ROS only through dyx3_system_gateway."
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vetri", email = "vetri96anitha@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-socketio>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dyx3_backend"]

[tool.ruff]
line-length = 100
