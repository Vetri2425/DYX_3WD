[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dyx3-backend"
version = "0.1.0"
description = "DYX 3WD production backend: REST + Socket.IO, auth, tablet-planned mission admission, telemetry, RTK profiles, storage. Never imports rclpy — reaches ROS only through dyx3_system_gateway."
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vetri", email = "vetri96anitha@gmail.com" }]
# Pinned to the versions validated on rover 01 (Python 3.10, 2026-10-10). The web/WebSocket stack is
# pinned exactly, as the prototype was: an unpinned upgrade must never reach a rover untested.
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "pydantic==2.14.0",
    "uvicorn[standard]==0.54.0",
    "websockets==16.1.1",
    "python-socketio==5.17.0",
    "python-engineio==4.14.0",
    "anyio==4.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dyx3_backend"]

[tool.ruff]
line-length = 100
