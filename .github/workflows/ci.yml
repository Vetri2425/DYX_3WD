name: CI

# Mirrors the DYX_4WD CI contract: colcon build + test, clang-format, backend
# checks, repo hygiene. Two jobs are 3WD-specific:
#   - legacy_quarantine: dyx3_rpp_legacy is the ONE permitted Python package in
#     the control graph (the shadow-run oracle). CI enforces that it stays
#     quarantined and never reaches a production install.
#   - path_engine tests run inside backend_checks, because the path engine is
#     deliberately Python and lives in the backend, not in ros2_ws.
# clang-tidy and interface-compatibility checks are not wired yet — no C++
# sources and no frozen interfaces exist to check against.

on:
  pull_request:
  push:

jobs:
  interface_freeze:
    name: interface freeze (version + changelog)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump and changelog for interface changes
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${EVENT_BEFORE:-}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if ! printf '%s\n' "$changed" | grep -Eq '^ros2_ws/src/dyx3_interfaces/(msg|srv|action)/'; then
            exit 0
          fi

          if ! printf '%s\n' "$changed" | grep -qx 'ros2_ws/src/dyx3_interfaces/package.xml'; then
            echo '::error::Interface fields changed without a dyx3_interfaces package version bump.'
            exit 1
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'docs/interfaces/CHANGELOG.md'; then
            echo '::error::Interface fields changed without docs/interfaces/CHANGELOG.md entry.'
            exit 1
          fi

          old_version="$(git show "$base:ros2_ws/src/dyx3_interfaces/package.xml" | sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p')"
          new_version="$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' ros2_ws/src/dyx3_interfaces/package.xml)"
          if [ -z "$old_version" ] || [ -z "$new_version" ] || [ "$old_version" = "$new_version" ]; then
            echo "::error::dyx3_interfaces version must change when its fields change (old=$old_version new=$new_version)."
            exit 1
          fi

  ros2_build_test:
    name: colcon build + test (ROS 2 Humble)
    runs-on: ubuntu-24.04-arm
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      # Message definitions only (GPSRAW for the quarantined legacy RPP's input shim);
      # no MAVROS process is installed or run.
      - name: install mavros_msgs
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq ros-humble-mavros-msgs

      # px4_msgs generated from the PINNED FIRMWARE's msg/ + srv/ (never stock): dyx3_px4_link needs
      # it, and the install is the same function the installer uses on the rover. Cached by pin.
      - name: px4_msgs cache
        id: px4cache
        uses: actions/cache@v4
        with:
          path: /opt/dyx3/px4_msgs
          key: px4_msgs-${{ runner.arch }}-${{ hashFiles('installer/pins/firmware.pin', 'installer/lib/ros_install.sh') }}

      - name: build px4_msgs from the pinned firmware
        if: steps.px4cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          DYX3_ALLOW_ANY_OS: "1"
          DYX3_BUILD_JOBS: "4"
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq git
          source installer/lib/common.sh
          source installer/lib/os_check.sh
          source installer/lib/dependencies.sh
          source installer/lib/ros_install.sh
          build_px4_msgs

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "$(ls -d /opt/dyx3/px4_msgs/*/install | head -1)/setup.bash"
          cd ros2_ws
          colcon build --symlink-install

      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "$(ls -d /opt/dyx3/px4_msgs/*/install | head -1)/setup.bash"
          cd ros2_ws
          colcon test
          colcon test-result --verbose

  native_geometry_tests:
    name: dyx3_geometry native tests (no ROS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure + build + test without a ROS installation
        run: |
          set -euo pipefail
          if [ ! -f ros2_ws/src/dyx3_geometry/CMakeLists.txt ]; then
            echo "dyx3_geometry not present yet — skipping"; exit 0
          fi
          cmake -S ros2_ws/src/dyx3_geometry -B build/geom_native -DDYX3_NATIVE_TESTS=ON
          cmake --build build/geom_native
          ctest --test-dir build/geom_native --output-on-failure

  clang_format:
    name: clang-format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PINNED — do not replace with apt. Ubuntu's clang-format tracks the runner
      # image and changes silently when GitHub bumps it, and Google style
      # definitions shift between LLVM releases, so an unpinned checker fails
      # untouched code. The PyPI wheel gives an exact version on every platform;
      # developers can match it locally with the same pip install.
      # Verified 2026-09-05: 20.1.8 and 23.1.0 both report 0 violations on this
      # tree, so the pin is not masking a disagreement between versions.
      - name: Install pinned clang-format
        run: pip install clang-format==20.1.8

      - name: clang-format --dry-run --Werror
        run: |
          clang-format --version
          find ros2_ws/src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -print0 | xargs -0 -r clang-format --dry-run --Werror

  backend_checks:
    name: backend + path engine (ruff + pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev,path-engine]"

      - name: ruff
        run: ruff check backend/src backend/tests

      - name: pytest
        run: pytest backend/tests

  installer_checks:
    name: installer (shellcheck + staged-root tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Staged root, fake colcon/ss/ping: proves the release lifecycle logic (build refusal,
      # atomic switch, automatic revert, config preservation, prune) and the platform
      # supervisor. It does NOT prove apt/ROS/NetworkManager/systemd on the Jetson.
      # PyPI wheel instead of apt: deterministic version and no dependence on the runner's apt mirror
      # (an apt-get hung a run for 10 minutes on 2026-10-07).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: shellcheck
        run: |
          pip install shellcheck-py==0.10.0.1
          shellcheck --version
          shellcheck -x installer/*.sh installer/lib/*.sh installer/ci/*.sh installer/tests/*.sh deployment/scripts/*.sh

      - name: installer tests
        run: bash installer/tests/run_tests.sh

  tools_tests:
    name: tools (rosbags extractors)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest numpy rosbags
      - name: pytest tools/tests
        run: pytest tools/tests

      - name: RPP parameter table is generated from the registry
        run: python3 tools/gen_param_tables.py --check

  legacy_quarantine:
    name: dyx3_rpp_legacy quarantine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the one permitted Python control package
        run: |
          set -euo pipefail
          fail=0

          echo "Checking that dyx3_rpp_legacy is the ONLY ament_python package..."
          while IFS= read -r pkg; do
            if grep -q 'ament_python' "$pkg" 2>/dev/null; then
              d=$(dirname "$pkg")
              if [ "$(basename "$d")" != "dyx3_rpp_legacy" ]; then
                echo "::error::$d is ament_python. Only dyx3_rpp_legacy may be Python."
                fail=1
              fi
            fi
          done < <(find ros2_ws/src -name package.xml)

          echo "Checking dyx3_rpp_legacy is excluded from the production manifest..."
          # Comments are stripped first: the manifest deliberately NAMES the package
          # in a comment explaining why it is absent. Only a real entry is a failure.
          if [ -f installer/manifests/production.manifest ]; then
            if sed 's/#.*//' installer/manifests/production.manifest \
               | grep -q '\bdyx3_rpp_legacy\b'; then
              echo "::error::dyx3_rpp_legacy must never ship in a production install."
              fail=1
            fi
          fi

          echo "Checking no C++ package depends on the legacy oracle..."
          if grep -rl 'dyx3_rpp_legacy' ros2_ws/src --include=package.xml \
             | grep -v 'dyx3_rpp_legacy/package.xml' | grep . ; then
            echo "::error::No package may depend on dyx3_rpp_legacy — it is a shadow oracle."
            fail=1
          fi

          exit "$fail"

  repo_hygiene:
    name: repo hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject backups, bags, ulogs, oversized files, build dirs, secrets
        run: |
          set -euo pipefail
          fail=0

          echo "Checking for backup-style files..."
          if git ls-files | grep -E '(\.backup$|\.bak$|\.before_.*|_old\.|_v2\.)'; then
            echo "::error::Backup-style files are not allowed. Git is the backup."
            fail=1
          fi

          echo "Checking for tracked bag/ulog/database files..."
          if git ls-files | grep -E '\.(db3|mcap|ulg)$'; then
            echo "::error::Bag/ulog files must not be committed."
            fail=1
          fi

          echo "Checking for tracked build/install/log directories..."
          if git ls-files | grep -E '(^|/)(build|install|log)/'; then
            echo "::error::Generated build/install/log directories must not be committed."
            fail=1
          fi

          echo "Checking for secrets..."
          if git ls-files | grep -E '(\.env$|ntrip.*\.(env|conf)$|.*\.token$|secrets/)'; then
            echo "::error::Credentials must never be committed. This repository is public."
            fail=1
          fi

          echo "Checking for files over 5MB..."
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "::error::$f is over 5MB ($size bytes)."
              fail=1
            fi
          done < <(git ls-files -z)

          exit "$fail"

  # ---------------------------------------------------------------- rover release artifacts
  # Proposal docs/architecture/proposals/2026-10-08_prebuilt-release-artifacts.md (ACCEPTED): the rover
  # installs what green CI built instead of compiling for ~40 min. Built only from deploy branches and only
  # after every check above passed. Same installer functions, same /opt/dyx3 paths as on the rover.
  rover_artifacts:
    name: rover artifacts (arm64 build)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/cloud-phases')
    needs: [interface_freeze, ros2_build_test, native_geometry_tests, clang_format, backend_checks, installer_checks, tools_tests, legacy_quarantine, repo_hygiene]
    runs-on: ubuntu-24.04-arm
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: build tools
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git zstd python3-venv python3-pip
          git config --global --add safe.directory '*'

      # Same key as ros2_build_test: the px4_msgs that passed the tests is the one shipped.
      - name: px4_msgs cache
        uses: actions/cache@v4
        with:
          path: /opt/dyx3/px4_msgs
          key: px4_msgs-${{ runner.arch }}-${{ hashFiles('installer/pins/firmware.pin', 'installer/lib/ros_install.sh') }}

      - name: build release + package
        shell: bash
        run: bash installer/ci/build_rover_artifacts.sh "$GITHUB_WORKSPACE/rover-artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: rover-artifacts
          path: rover-artifacts/
          retention-days: 3

  rover_publish:
    name: publish rover release
    needs: [rover_artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: "20"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rover-artifacts
          path: rover-artifacts

      - name: verify digests
        run: cd rover-artifacts && sha256sum --check --strict SHA256SUMS

      - name: publish rover-${{ github.sha }}
        run: |
          set -euo pipefail
          tag="rover-${GITHUB_SHA}"
          notes="Rover install artifacts for ${GITHUB_SHA} (${GITHUB_REF_NAME}). Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Installed by dyx3-install / dyx3-upgrade; verify against SHA256SUMS."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" rover-artifacts/* --clobber
          else
            gh release create "$tag" rover-artifacts/* --target "$GITHUB_SHA" --prerelease \
              --title "rover ${GITHUB_SHA:0:10} (${GITHUB_REF_NAME})" --notes "$notes"
          fi

      # Human decision 2026-10-08: keep the last 20 rover releases.
      - name: prune old rover releases
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("rover-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP|tonumber):] | .[].tagName' |
            while read -r t; do
              echo "pruning $t"
              gh release delete "$t" --yes --cleanup-tag
            done
