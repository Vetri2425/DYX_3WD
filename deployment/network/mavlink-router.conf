# /etc/dyx3/mavlink-router.conf — service plane only. Created once; never overwritten.
#
# PX4 side: UDP server on the FCU-facing address. PX4 only talks to it when MAV_2_CONFIG
# is enabled on the FCU (proposal 2026-10-07: default is 0, so this router is idle).
# QGC side: TCP server on 5760 (reached over the hotspot).
[General]
TcpServerPort=5760
ReportStats=false

[UdpEndpoint px4]
Mode=Server
Address=10.41.10.1
Port=14550
